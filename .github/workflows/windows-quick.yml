name: Windows Quick Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        required: false
        default: main

concurrency:
  group: windows-quick-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.5'
  IS_GITHUB_ACTIONS: 1
  CHANNEL: dev

jobs:
  build-windows-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Download Windows core libs
        shell: bash
        run: make windows-libs

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: |
          flutter pub get
          dart run slang

      - name: Build Windows release
        run: flutter build windows --release --target=lib/main.dart

      - name: Pack portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "out/v2et-windows-portable.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-quick-portable
          path: out/v2et-windows-portable.zip
          retention-days: 7
