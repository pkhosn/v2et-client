name: Windows Quick EXE

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        required: false
        default: main

concurrency:
  group: windows-quick-exe-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.5'
  IS_GITHUB_ACTIONS: 1
  CHANNEL: dev

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare dependencies
        shell: bash
        run: |
          choco install innosetup -y
          make windows-install-deps
          make windows-prepare

      - name: Build EXE installer
        shell: bash
        env:
          SENTRY_DSN: ''
        run: make windows-exe-release

      - name: Fallback build runner exe
        shell: bash
        run: |
          if ! ls dist/*/*.exe >/dev/null 2>&1; then
            echo "No installer found from fastforge, building runner exe fallback"
            flutter build windows --release --target=lib/main.dart
          fi

      - name: Collect EXE artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Get-ChildItem -Path dist -Recurse | Select-Object FullName
          $exe = Get-ChildItem -Path dist -Recurse -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            $runnerExe = Get-ChildItem -Path "build/windows" -Recurse -Filter "*.exe" | Select-Object -First 1
            if (-not $runnerExe) { throw "No .exe found in dist or build output" }
            Copy-Item $runnerExe.FullName "out/v2et-windows-runner.exe" -Force
          } else {
            Copy-Item $exe.FullName "out/v2et-windows-setup.exe" -Force
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-quick-exe
          path: out/*.exe
          retention-days: 7
