# Post-installation tasks:
# 1. Inject StartupWMClass into the system .desktop file for correct icon association
# 2. Remove conflicting desktop entries from users' .local directories (legacy + AppImage artifacts)
# 3. Update the desktop database to apply changes immediately
postinstall_scripts:
  - echo "Setting up V2ET..."
  - sudo sed -i '/^\[Desktop Entry\]/a StartupWMClass=com.v2et.client' "/usr/share/applications/v2et.desktop"
  - echo "Search and remove local desktop overrides"
  - for user_dir in /home/*; do if [ -f "$user_dir/.local/share/applications/v2et.desktop" ]; then rm -f "$user_dir/.local/share/applications/v2et.desktop"; echo "Removed v2et.desktop from $user_dir .local"; fi; if [ -f "$user_dir/.local/share/applications/hiddify.desktop" ]; then rm -f "$user_dir/.local/share/applications/hiddify.desktop"; echo "Removed hiddify.desktop from $user_dir .local"; fi; done
  - update-desktop-database /usr/share/applications
  - echo "V2ET is ready to use :)"

# Post-uninstallation tasks:
# 1. Iterate through all user directories to remove Hiddify configuration and data
# 2. Clean up root user data to ensure a clean removal
postuninstall_scripts:
  - echo "Removing V2ET user data..."
  - for user_dir in /home/*; do if [ -d "$user_dir/.local/share/v2et" ]; then rm -rf "$user_dir/.local/share/v2et"; echo "Removed data from $user_dir"; fi; done
  - rm -rf /root/.local/share/v2et
  - echo "V2ET data cleanup complete."

